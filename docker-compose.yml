services:
  api:
    build: .
    container_name: api-monitoring-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./monitoring.db:/app/monitoring.db

  frontend:
    build: .
    container_name: api-monitoring-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    command: >
      streamlit run frontend/app.py
      --server.address=0.0.0.0
      --server.port=8501